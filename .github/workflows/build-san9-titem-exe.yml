name: build-san9-titem-exe

on:
  push:
    branches: [ main ]
    paths:
      - 'san9-titem-editor/**'
      - '.github/workflows/build-san9-titem-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: san9-titem-editor
    steps:
      - uses: actions/checkout@v4

      - name: Setup 32-bit MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc

      - name: Compile (UTF-8 source, GBK exec charset)
        shell: msys2 {0}
        run: |
          set -e
          if gcc -O2 -mwindows -finput-charset=UTF-8 -fexec-charset=GBK \
              -o San9TItemEditor.exe titem_editor.c \
              -lgdi32 -luser32 -lkernel32 -lcomdlg32 2>build_a.log; then
            echo "OK: built from UTF-8 source with -fexec-charset=GBK"
            cat build_a.log || true
          else
            echo "FALLBACK: compiling GBK-encoded source as-is"
            cat build_a.log || true
            gcc -O2 -mwindows -o San9TItemEditor.exe titem_editor_gbk.c \
              -lgdi32 -luser32 -lkernel32 -lcomdlg32
          fi

      - name: Verify artifact
        shell: pwsh
        run: |
          $f = Get-Item san9-titem-editor/San9TItemEditor.exe
          Write-Host ("SIZE  = " + $f.Length + " bytes")
          $b = [System.IO.File]::ReadAllBytes($f.FullName)
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "not a PE file" }
          Write-Host "PE header OK (MZ)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: San9TItemEditor
          path: san9-titem-editor/San9TItemEditor.exe
          if-no-files-found: error
